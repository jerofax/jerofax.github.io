<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tres vértices de la malla: cada arista toma el color del vértice
       del que sale, y el de arriba es un "hub", más grande. -->
  <g stroke-width="2.2" stroke-linecap="round">
    <line x1="16" y1="5.5" x2="5.5" y2="25.5" stroke="#8b5cf6" />
    <line x1="26.5" y1="25.5" x2="16" y2="5.5" stroke="#eab308" />
    <line x1="5.5" y1="25.5" x2="26.5" y2="25.5" stroke="#22c55e" />
  </g>
  <circle cx="16" cy="5.5" r="4.2" fill="#8b5cf6" />
  <circle cx="5.5" cy="25.5" r="3.2" fill="#22c55e" />
  <circle cx="26.5" cy="25.5" r="3.2" fill="#eab308" />
</svg>
